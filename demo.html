<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BANTAYO - GIS Mapping Demo</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/exifreader@4/dist/exif-reader.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Heatmap plugin for Leaflet -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <!-- Same Baguio map helper your app already uses -->
  <script src="baguio-map.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans min-h-screen transition-colors">

  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="logo.png" alt="BANTAYO Logo" class="w-10 h-10 object-contain rounded-xl border border-slate-200 dark:border-slate-800 bg-white" />
      <div>
        <h1 class="text-base font-extrabold tracking-wide leading-none">BANTAYO</h1>
        <p class="text-[10px] text-slate-500 dark:text-slate-400 mt-1">GIS hazard mapping demo</p>
      </div>
    </div>
    <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-amber-400 cursor-pointer" title="Light / dark">
      <i id="theme-icon" data-lucide="sun" class="w-4 h-4"></i>
    </button>
  </header>

  <main class="max-w-3xl mx-auto p-4 space-y-4">

    <!-- Photo input -->
    <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-md">
      <div class="flex justify-center gap-3">
        <button onclick="document.getElementById('file-input').click()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-5 py-3 rounded-xl shadow flex items-center gap-2 cursor-pointer">
          <i data-lucide="upload" class="w-4 h-4"></i> Upload Files
        </button>
      </div>
      <input id="file-input" type="file" accept="image/*" multiple class="hidden" />
      <p class="text-[11px] text-center text-slate-500 dark:text-slate-400 mt-3">Pick as many photos as you like. Each photo's own GPS location is read and pinned on the map.</p>

      <div id="photo-list" class="mt-4 space-y-2"></div>

      <button id="submit-btn" onclick="submitAll()" disabled class="mt-4 w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-xs font-bold py-3.5 rounded-xl shadow cursor-pointer">
        Submit
      </button>
      <p id="status" class="text-[11px] text-center mt-2 text-slate-500 dark:text-slate-400 min-h-[1rem]"></p>
    </section>

    <!-- Map -->
    <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-4 shadow-md">
      <div class="mb-3 px-1">
        <h2 class="text-xs font-bold">Hazard map</h2>
      </div>
      <div id="map" class="w-full rounded-2xl border border-slate-200 dark:border-slate-800" style="height:420px;z-index:1"></div>
      <div class="flex items-center gap-2 mt-3 px-1 text-[10px] text-slate-500 dark:text-slate-400">
        <span>Few</span>
        <div class="h-2 flex-1 rounded-full" style="background:linear-gradient(90deg,#3b82f6,#22c55e,#facc15,#f97316,#dc2626)"></div>
        <span>Many</span>
      </div>
    </section>
  </main>

  <script>
    // ---------- Theme ----------
    function applyTheme(t) {
      document.documentElement.classList.toggle('dark', t !== 'light');
      const i = document.getElementById('theme-icon');
      if (i) i.setAttribute('data-lucide', t === 'light' ? 'moon' : 'sun');
      localStorage.setItem('bantayo-theme', t);
      lucide.createIcons();
    }
    function toggleTheme() { applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark'); }
    applyTheme(localStorage.getItem('bantayo-theme') || 'dark');

    // ---------- Database (same Firebase project as the app) ----------
    firebase.initializeApp({
      apiKey: "AIzaSyC2WSefQ2Hs6S4AJBESDs4F5iJwPK7jVzU",
      authDomain: "bantayoapplication.firebaseapp.com",
      projectId: "bantayoapplication",
      storageBucket: "bantayoapplication.firebasestorage.app",
      messagingSenderId: "51777911890",
      appId: "1:51777911890:web:0c876b31a75ab8c0f7338b"
    });
    const db = firebase.firestore();
    const COLLECTION = 'demo_reports';

    // ---------- State ----------
    let items = [];          // photos waiting to be submitted
    let saved = [];          // reports already in the database
    let pickingFor = null;   // photo id waiting for a map tap
    let nextId = 1;
    const map = createBaguioMap(document.getElementById('map'), { zoom: 14 });
    const pendingLayer = L.layerGroup().addTo(map);
    const savedLayer = L.layerGroup().addTo(map);
    let heat = L.heatLayer([], { radius: 28, blur: 22, maxZoom: 17, minOpacity: 0.35 }).addTo(map);

    
    function readExifGps(file) {
      return ExifReader.load(file).then(t => {
        if (!t.GPSLatitude || !t.GPSLongitude) return null;
        let lat = Number(t.GPSLatitude.description), lng = Number(t.GPSLongitude.description);
        const latRef = t.GPSLatitudeRef && t.GPSLatitudeRef.value && t.GPSLatitudeRef.value[0];
        const lngRef = t.GPSLongitudeRef && t.GPSLongitudeRef.value && t.GPSLongitudeRef.value[0];
        if (latRef === 'S') lat = -Math.abs(lat);
        if (lngRef === 'W') lng = -Math.abs(lng);
        return Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;
      }).catch(() => null);
    }
    function makeThumb(file, max = 480) {
      return new Promise(res => {
        const img = new Image(), url = URL.createObjectURL(file);
        img.onload = () => {
          const s = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          res(c.toDataURL('image/jpeg', 0.6));
        };
        img.onerror = () => res('');
        img.src = url;
      });
    }

    async function addFiles(fileList) {
      for (const file of Array.from(fileList)) {
        const it = { id: nextId++, name: file.name, thumb: '', loc: null, source: '' };
        items.push(it);
        render();
        it.thumb = await makeThumb(file);
        const exif = await readExifGps(file);
        if (exif) { it.loc = exif; it.source = 'photo GPS'; }
        render();
      }
    }
    document.getElementById('file-input').onchange = e => { addFiles(e.target.files); e.target.value = ''; };

    // ---------- Rendering ----------
    function render() {
      const list = document.getElementById('photo-list');
      list.innerHTML = items.map(it => {
        const ok = it.loc && isInsideBaguio(it.loc.lat, it.loc.lng);
        const msg = !it.loc ? 'No GPS in this photo' : ok ? `${it.loc.lat.toFixed(5)}, ${it.loc.lng.toFixed(5)} · ${it.source}` : 'Location is outside Baguio';
        return `<div class="flex items-center gap-3 p-2 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
          <img src="${it.thumb}" class="w-12 h-12 rounded-xl object-cover bg-slate-200 dark:bg-slate-800" alt="">
          <div class="flex-1 min-w-0">
            <p class="text-[11px] font-bold truncate">${escHtml(it.name)}</p>
            <p class="text-[10px] ${ok ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">${msg}</p>
          </div>
          ${ok ? '' : `<button onclick="pickLocation(${it.id})" class="text-[10px] font-bold px-2.5 py-1.5 rounded-lg border border-blue-500 text-blue-600 dark:text-blue-400 cursor-pointer">${pickingFor === it.id ? 'Tap the map…' : 'Pin on map'}</button>`}
          <button onclick="removeItem(${it.id})" class="text-xs px-2 py-1 rounded-lg bg-slate-200 dark:bg-slate-800 cursor-pointer" aria-label="Remove">✕</button>
        </div>`;
      }).join('');

      pendingLayer.clearLayers();
      items.forEach(it => {
        if (it.loc && isInsideBaguio(it.loc.lat, it.loc.lng)) {
          L.marker([it.loc.lat, it.loc.lng]).addTo(pendingLayer).bindPopup(`<b>${escHtml(it.name)}</b><br><img src="${it.thumb}" style="width:140px;border-radius:8px;margin-top:4px">`);
        }
      });
      const ready = items.filter(it => it.loc && isInsideBaguio(it.loc.lat, it.loc.lng)).length;
      const btn = document.getElementById('submit-btn');
      btn.disabled = ready === 0;
      btn.textContent = ready > 1 ? `Submit ${ready} photos` : 'Submit';
      if (items.length) {
        const pts = items.filter(it => it.loc && isInsideBaguio(it.loc.lat, it.loc.lng)).map(it => [it.loc.lat, it.loc.lng]);
        if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 17 });
      }
      lucide.createIcons();
    }
    function removeItem(id) { items = items.filter(i => i.id !== id); if (pickingFor === id) pickingFor = null; render(); }
    function pickLocation(id) { pickingFor = id; setStatus('Tap the map to place this photo.'); render(); }
    map.on('click', e => {
      if (pickingFor === null) return;
      const it = items.find(i => i.id === pickingFor);
      pickingFor = null;
      if (!it) return;
      if (!isInsideBaguio(e.latlng.lat, e.latlng.lng)) { setStatus('That spot is outside Baguio. Tap inside the blue outline.'); return; }
      it.loc = { lat: e.latlng.lat, lng: e.latlng.lng }; it.source = 'pinned on map';
      setStatus(''); render();
    });
    function setStatus(t) { document.getElementById('status').textContent = t; }

    // ---------- Heatmap + saved pins ----------
    function refreshSaved() {
      savedLayer.clearLayers();
      const pts = saved.filter(r => isInsideBaguio(r.lat, r.lng));
      pts.forEach(r => {
        L.circleMarker([r.lat, r.lng], { radius: 5, color: '#fff', weight: 1.5, fillColor: '#dc2626', fillOpacity: 0.95 })
          .addTo(savedLayer).bindPopup(`<b>${escHtml(r.name || 'Report')}</b>${r.thumb ? `<br><img src="${r.thumb}" style="width:140px;border-radius:8px;margin-top:4px">` : ''}`);
      });
      heat.setLatLngs(pts.map(r => [r.lat, r.lng, 1]));
    }

    // Live updates: every device that opens the demo sees new reports instantly
    function loadLocal() { try { return JSON.parse(localStorage.getItem('bantayo-demo-local') || '[]'); } catch (e) { return []; } }
    db.collection(COLLECTION).onSnapshot(
      snap => { saved = snap.docs.map(d => d.data()).concat(loadLocal()); refreshSaved(); },
      err => { console.warn('Database unavailable, using this device only:', err); saved = loadLocal(); refreshSaved(); setStatus('Database not reachable. Reports are kept on this device only.'); }
    );

    // ---------- Submit ----------
    async function submitAll() {
      const ready = items.filter(it => it.loc && isInsideBaguio(it.loc.lat, it.loc.lng));
      if (!ready.length) return;
      const btn = document.getElementById('submit-btn');
      btn.disabled = true; setStatus(`Saving ${ready.length} photo${ready.length === 1 ? '' : 's'}…`);

      const docs = ready.map(it => ({
        name: it.name, lat: it.loc.lat, lng: it.loc.lng, locationSource: it.source,
        thumb: it.thumb, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }));
      try {
        const batch = db.batch();
        docs.forEach(d => batch.set(db.collection(COLLECTION).doc(), d));
        await Promise.race([batch.commit(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
        setStatus(`✓ Submitted ${ready.length} photo${ready.length === 1 ? '' : 's'} with their locations.`);
      } catch (err) {
        console.warn('Saved on this device instead:', err);
        const local = loadLocal().concat(docs.map(d => ({ ...d, createdAt: Date.now() })));
        localStorage.setItem('bantayo-demo-local', JSON.stringify(local));
        saved = saved.concat(docs); refreshSaved();
        setStatus('Saved on this device (database not reachable). Check the Firestore rules.');
      }
      items = items.filter(it => !ready.includes(it));
      render();
    }
    render();
  </script>
</body>
</html>
